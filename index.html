
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Live Stream</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      padding: 0;
      background: #000;
      overflow: hidden;
    }

    .video-container {
      width: 100%;
      height: 100vh;
      background: #000;
    }

    iframe {
      width: 100%;
      height: 100%;
      border: 0;
      display: block;
    }
  </style>
</head>

<body>

  <div class="video-container">
    <iframe
      src="https://trend48.st/event/m-la-clippers-vs-golden-state-warriors-1102?stream=1"
      allow="fullscreen; encrypted-media; picture-in-picture"
      allowfullscreen
      referrerpolicy="no-referrer"
      scrolling="no">
    </iframe>
  </div>

</body>
</html>
